name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action diffs the push's commit range — a shallow
          # clone (the default) leaves the parent commit unreachable and
          # the scan fails outright with "unknown revision", not just an
          # empty result. Needs full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs across every workspace (packages/shared, apps/backend,
      # apps/frontend, apps/admin) via each package.json's own script —
      # `next build` also lints+type-checks the two Next.js apps; the
      # backend/shared "build" scripts are `tsc --noEmit` (they have no
      # compiled output — both run via tsx/ts directly at runtime).
      - name: Type check and build
        run: npm run build

      - name: Lint (backend — the two Next.js apps already lint via build)
        run: npm run lint --workspace apps/backend

      - name: Unit tests
        run: npm run test

      - name: Dependency audit (SPEC §27)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret scan (SPEC §27)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
