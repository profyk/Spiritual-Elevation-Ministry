name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check, lint, and build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Dependency audit (SPEC §27)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret scan (SPEC §27)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
